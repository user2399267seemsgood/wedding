  venue_text: "<a href=\"https://louzeiras.com\">Monte das Louzeiras</a> é uma marca única do Alentejo - a região mais ensolarada de Portugal, uma região de sabores, paisagens pitorescas, artesanato e legados históricos, um lugar onde se envolve com séculos de história e compreende o tempo na sua plenitude, em todos os sentidos. O monte está situado no meio das oliveiras centenárias entre Vale de Vargo e Vila Nova São Bento no Conselho de Serpa."

  accommodation_title: 'Alojamento'
  accommodation_text: "Para quem voa para Lisboa na sexta-feira antes do casamento, recomendamos ir para Serpa de carro alugado ou de autocarro, partindo da estação rodoviária \"Sete Rios\" (vê a <a href=\"https://www.rome2rio.com/de/map/Lissabon/Serpa?departureDate=2026-05-22# r/Bus/s/0\">sugestão Rome2Rio</a>). Em Serpa, com condições especiais para o nosso casamento, existe o <a href=\"https://serpahotel.pt/\">Hotel Serpa</a>, onde podem reservar um quarto com 10% de desconto. Para isso, podem usar o código de desconto <code>ML10</code> ao reservar um quarto <code>Oferta não reembolsável, pequeno-almoço incluído</code>. Para aqueles que não têm transporte, organizaremos um serviço de transporte que levará os convidados do hotel para a igreja, da igreja para o copo de água e de volta ao hotel."
  accommodation_text2: "Também existe a possibilidade de pernoitar em tendas glamorosas directamente no local do copo de água, no Monte das Louzeiras. Por 90 €, podem reservar uma das 8 tendas, com pequeno-almoço incluído. Todas as informações adicionais sobre cada alojamento podem ser encontradas na página de reservas correspondente."
  accommodation_button_title: 'Reservar'
  accommodation_link: 'https://serpahotel.pt/'
