  venue_text: "<a href=\"https://louzeiras.com\">Monte das Louzeiras</a> is a unique brand from Alentejo - the sunniest region in Portugal, a region of flavours picturesque landscapes, handicrafts and historical legacies, a place where you get involved with centuries of history and understand time in its plentitude in every sense. The farm sits in middle of centuries-old olive trees between Vale de Vargo and Vila Nova São Bento in the council of Serpa."

  accommodation_title: 'Accommodation'
  accommodation_text: "For those flying to Lisbon on the Friday before the wedding, we recommend traveling to Serpa either by rental car or by bus from the \"Sete Rios\" bus station (see <a href=\"https://www.rome2rio.com/de/map/Lissabon/Serpa?departureDate=2026-05-22# r/Bus/s/0\">Rome2Rio suggestion</a>). In Serpa, the <a href=\"https://serpahotel.pt/en\">Hotel Serpa</a> is offering special rates for our wedding, and you are welcome to book a room with a 10% discount. To do so, use the discount code <code>ML10</code> when booking a room <code>Non-refundable offer, breakfast included</code>. For those who do not have a ride, we will organize a shuttle to take guests from the hotel to the church, from the church to the wedding reception, and back to the hotel."
  accommodation_text2: "There is also the option of staying overnight in glamping tents at the wedding venue, Monte das Louzeiras. For 90 €, you can reserve one of the 8 tents for yourselves, including breakfast. You can find all further information about the respective accommodation on the corresponding booking page."
