  venue_title: 'Ort'
  venue_text: "<a href=\"https://louzeiras.com\">Monte das Louzeiras</a> ist eine einzigartige Marke aus dem Alentejo – der sonnigsten Region Portugals, einer Region voller Aromen, malerischer Landschaften, Kunsthandwerk und historischer Hinterlassenschaften, ein Ort, an dem Sie sich auf Jahrhunderte alte Geschichte einlassen und die Zeit in ihrer Fülle in jeder Hinsicht verstehen. Die Farm liegt inmitten jahrhundertealten Olivenbäume zwischen Vale de Vargo und Vila Nova São Bento im Gemeindegebiet von Serpa."

  accommodation_title: 'Unterkunft'
  accommodation_text: "Für diejenigen, die am Freitag vor der Hochzeit nach Lissabon fliegen, empfehlen wir entweder mit einem Mietauto oder mit dem Bus, von der Bus Station \"Sete Rios\" aus, nach Serpa zu fahren (siehe <a href=\"https://www.rome2rio.com/de/map/Lissabon/Serpa?departureDate=2026-05-22#r/Bus/s/0\">Vorschlag Rome2Rio</a>). In Serpa gibt es, mit Spezialkonditionen für unsere Hochzeit, das <a href=\"https://serpahotel.pt/en\">Hotel Serpa</a>, in dem ihr gerne ein Zimmer mit 10% Rabatt buchen könnt. Dazu könnt ihr den Rabattcode <code>ML10</code> bei der Buchung eines Zimmers <code>Non-refundable offer, breakfast included</code> verwenden. Für diejenigen, die keine Mitfahrgelegenheit haben, werden wir einen Shuttle organisieren, der die Gäste vom Hotel zur Kirche, von der Kirche zum Hochzeitsfest und wieder zurück zum Hotel fahren wird."
  accommodation_text2: "Es gibt auch die Möglichkeit direkt beim Hochzeitsfest, im Monte das Louzeiras, in Glamping Zelten zu übernachten. Für 90 € könnt ihr dort eines der 8 Zelte für euch reservieren inkl. Frühstück. Alle weiteren Infos zu der jeweiligen Unterkunft findet ihr auf den entsprechenden Buchungsseite."
  accommodation_button_title: 'Hier buchen'
  accommodation_link: 'https://serpahotel.pt/en'
  accommodation_link2: 'https://louzeiras.com/de/collections/campsite-on-the-farm-of-monte-das-louzeiras'

